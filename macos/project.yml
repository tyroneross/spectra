name: Spectra
options:
  bundleIdPrefix: dev.spectra
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: Q6TB8685V9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2026 Tyrone Ross, Jr"
    INFOPLIST_KEY_CFBundleDisplayName: "Spectra"
    INFOPLIST_KEY_NSAppleEventsUsageDescription: "Spectra controls applications for UI capture and walkthrough."
    INFOPLIST_KEY_NSAudioCaptureUsageDescription: "Spectra records system audio only when you enable audio for a demo capture."
    PRODUCT_BUNDLE_IDENTIFIER: dev.spectra.app
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_IDENTITY[sdk=macosx*]: "Apple Development"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_COMPILATION_MODE: singlefile
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Spectra:
    type: application
    platform: macOS
    sources:
      - path: Spectra
        excludes:
          - "**/.DS_Store"
          # DaemonCore is a separately built command-line executable with its
          # own top-level main.swift. Never sweep it into the SwiftUI app.
          - "DaemonCore/**"
          # Internal porting notes are repository documentation, not runtime
          # application resources.
          - "CDP/PORT-NOTES.md"
    resources:
      - path: Spectra/Assets.xcassets
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Spectra/Spectra.entitlements
        PRODUCT_NAME: Spectra
        INFOPLIST_KEY_CFBundleDisplayName: "Spectra"
        # Menu-bar-only app: hide Dock icon, hide main menu
        INFOPLIST_KEY_LSUIElement: YES
    info:
      path: Spectra/Info.plist
      properties:
        LSUIElement: YES
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "1"
        NSAppleEventsUsageDescription: "Spectra controls applications for UI capture and walkthrough."
        NSAudioCaptureUsageDescription: "Spectra records system audio only when you enable audio for a demo capture."
        NSHumanReadableCopyright: "Copyright (c) 2026 Tyrone Ross, Jr"
    # Bundle production boundary (native-Swift migration M1): embeds the
    # already-built native helper executables from ~/.spectra/bin (the complete
    # eight-helper inventory is produced by scripts/build-and-refresh.sh) into
    # Contents/Helpers/ of the built app, so a signed
    # Spectra.app carries its own capture/AX/vision helpers inside one signed
    # boundary. Screen Recording/AX attribution is verified separately on the
    # installed app. Runs LAST (postBuildScripts),
    # before Xcode's own automatic bundle codesign, so the copied+resigned files
    # are covered by the app's final signature. Release is strict: one missing
    # helper fails the build. Debug remains permissive for local UI work.
    postBuildScripts:
      - name: Embed Native Helpers
        script: |
          set -euo pipefail
          if [ "${CONFIGURATION}" = "Release" ]; then
            export SPECTRA_REQUIRE_BUNDLED_HELPERS=1
          fi
          make -C "${SRCROOT}" embed-helpers
        basedOnDependencyAnalysis: false

  SpectraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SpectraTests
      # Compile the Foundation-only resolver into the test bundle without
      # adding the rest of DaemonCore (or its main.swift) to the app target.
      - path: Spectra/DaemonCore/BundleHelperPaths.swift
    dependencies:
      - target: Spectra
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Spectra.app/Contents/MacOS/Spectra"

schemes:
  Spectra:
    build:
      targets:
        Spectra: all
        SpectraTests: [test]
    test:
      targets:
        - SpectraTests
    run:
      config: Debug
    archive:
      config: Release
