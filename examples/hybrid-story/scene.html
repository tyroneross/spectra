<!doctype html>
<html lang="en"><meta charset="utf-8"><title>One clear idea</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e19;color:#f8fafc;font-family:system-ui,sans-serif}
main{position:absolute;inset:10%;display:flex;flex-direction:column;justify-content:center}
small{color:#69cff5;font-size:2.2vw;font-weight:650;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:7vw;line-height:1.04;max-width:90%;margin:.35em 0;letter-spacing:-.045em}
p{font-size:2.8vw;line-height:1.45;color:#b7c5d9;max-width:76%;margin:0}
.orb{position:absolute;right:6%;bottom:12%;width:20vw;height:20vw;border:2px solid #27afe8;border-radius:50%;background:radial-gradient(circle at 30% 30%,#27afe838,transparent 65%)}
.rule{width:9vw;height:4px;background:#27afe8;margin:2.5vw 0}
</style>
<div class="orb"></div><main><small></small><h1></h1><div class="rule"></div><p></p></main>
<script>
const main=document.querySelector('main'), orb=document.querySelector('.orb');
const ease=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);
window.renderFrame=(ms,{props})=>{
  document.querySelector('small').textContent=props.label;
  document.querySelector('h1').textContent=props.heading;
  document.querySelector('p').textContent=props.body;
  const enter=ease(ms/650), exit=ease((ms-(props.durationMs-450))/450);
  main.style.transform=`translateY(${(1-enter)*28-exit*14}px)`;
  main.style.opacity=String(enter*(1-exit));
  orb.style.transform=`translateY(${Math.sin(ms/1800)*12}px) scale(${.9+enter*.1})`;
  orb.style.opacity=String(.25+.55*enter*(1-exit));
};
</script></html>
